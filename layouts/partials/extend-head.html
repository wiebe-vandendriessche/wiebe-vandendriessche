<style>
@font-face {
    font-family: font;
    src: url('{{ "fonts/UGentPannoText-Medium.ttf" | relURL }}');
}
</style>

{{ $interactiveEffects := resources.Get "js/interactive-effects.js" }}
{{ $interactiveEffects = $interactiveEffects | resources.Minify | resources.Fingerprint (.Params.fingerprintAlgorithm | default "sha512") }}
<script
    type="text/javascript"
    src="{{ $interactiveEffects.RelPermalink }}"
    integrity="{{ $interactiveEffects.Data.Integrity }}"></script>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
></script>

{{ if hugo.IsProduction }}
<script type="module">
    import { inject as injectAnalytics } from 'https://cdn.jsdelivr.net/npm/@vercel/analytics@1.4.1/dist/index.mjs';
    import { injectSpeedInsights } from 'https://cdn.jsdelivr.net/npm/@vercel/speed-insights@2.0.0/dist/index.mjs';

    injectAnalytics();
    injectSpeedInsights();
</script>
{{ end }}
